[package]
name = "snapmark"
version = "0.8.10"
license = "Apache-2.0"
repository = "https://github.com/r-reyrou-public/screenshot-tool"
edition = "2024"
description = "Windows 向けの常駐型スクリーンショット&注釈ツール SnapMark (egui)"
readme = "README.md"
publish = false

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
egui = "0.37.0"
global-hotkey = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6.2"
rfd = "0.17.2"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_Networking_WinHttp", "Win32_Security", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9.8"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
